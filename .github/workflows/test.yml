name: tests
on: [push, pull_request]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - name: Pruebas (Linux con pantalla virtual)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick tesseract-ocr xterm
          xvfb-run -a npm test
      - name: Pruebas (Windows)
        if: runner.os != 'Linux'
        run: npm test
      - name: Selftest nativo (Windows)
        if: runner.os == 'Windows'
        run: npm run selftest
